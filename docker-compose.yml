services:

  postgres:
    image: postgres:16
    container_name: mini-photoshop-postgres

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U keycloak -d keycloak"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0

    container_name: mini-photoshop-keycloak

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - start-dev
      - --import-realm
      - --db=postgres
      - --db-url=jdbc:postgresql://postgres:5432/keycloak
      - --db-username=keycloak
      - --db-password=${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      - --db-password=keycloak
      - --hostname-strict=false
      - --http-enabled=true
      - --http-port=8080

    environment:

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}

      KC_DB: postgres

      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak

      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}

      KC_HOSTNAME_STRICT: "false"

      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"

    ports:
      - "8080:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro


volumes:

  postgres_data:

  keycloak_data: