{% load static %}

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<style>

:root {
    --bg: #061428;
    --card: #0c1f36;
    --accent: #2b8cff;
    --accent-2: #5b7cff;
    --text: #e9f2ff;
    --muted: #9fb3d6;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background:
        linear-gradient(
            180deg,
            #041021 0%,
            #061428 60%
        );

    font-family: Arial, sans-serif;

    padding: 0;
}

.form-card {

    width:
        min(
            460px,
            calc(100% - 20px)
        );

    max-width: 460px;

    margin:
        32px auto 24px;

    padding:
        28px 18px;

    border-radius: 14px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.007)
        );

    border:
        1px solid
        rgba(255,255,255,0.04);

    box-shadow:
        0 18px 45px
        rgba(2,8,23,0.6),

        0 1px 0
        rgba(255,255,255,0.02)
        inset;
}

.form-card h2 {

    color: var(--text);

    margin:
        0 0 12px;

    font-size: 22px;

    text-align: center;
}

.description {

    color: var(--muted);

    font-size: 14px;

    line-height: 1.5;

    text-align: center;

    margin-bottom: 22px;
}

.btn-primary {

    display: block;

    width: 100%;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--accent-2)
        );

    color: #fff;

    padding: 12px 14px;

    border-radius: 10px;

    border: none;

    font-weight: 700;

    font-size: 15px;

    text-decoration: none;

    text-align: center;

    cursor: pointer;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.btn-primary:hover {

    opacity: 0.92;

    transform:
        translateY(-1px);
}

.small {

    font-size: 13px;

    color: var(--muted);

    margin-top: 18px;

    text-align: center;
}

.link {

    color: var(--accent);

    text-decoration: none;

    font-weight: 600;
}

.link:hover {

    text-decoration: underline;
}


@media (max-width: 600px) {

    .form-card {

        width:
            calc(100% - 16px);

        margin:
            20px auto;

        padding:
            22px 14px;
    }

    .form-card h2 {

        font-size: 20px;
    }
}

</style>


{% include 'editor/includes/header_top.html' %}


<div class="form-card">

    <h2>
        Welcome back
    </h2>


    <div class="description">

        Sign in securely to
        MiniPhotoShop with Keycloak.

    </div>


    <a
        class="btn-primary"
        href="{% url 'oidc_authentication_init' %}"
    >
        Log in
    </a>


    <div class="small">

        Don't have an account?

        <a
            class="link"
            href="{% url 'register' %}"
        >
            Create account
        </a>

    </div>

</div>
